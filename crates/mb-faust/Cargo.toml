[package]
name = "mb-faust"
version.workspace = true
edition.workspace = true
description = "Faust JIT integration for masterblaster"

[features]
# Enable to run tests. libfaust is not thread-safe, so tests must run
# single-threaded via `make test-faust`.
faust-tests = []

[dependencies]
mb-ir = { workspace = true, features = ["std"] }
mb-engine = { workspace = true }
dirs = "6"
md5 = "0.7"
